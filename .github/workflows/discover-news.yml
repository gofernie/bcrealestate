name: Discover local news
on:
  schedule:
    - cron: "17 13 * * *"   # daily ~7:17am Mountain (13:17 UTC)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/discover-news.mjs
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          NEWS_SMS_FROM: ${{ secrets.NEWS_SMS_FROM }}
          NEWS_ADMIN_PHONE: ${{ secrets.NEWS_ADMIN_PHONE }}

